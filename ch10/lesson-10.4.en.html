  "title": "Representing Graphs and Graph Isomorphism",
  "lede": "To compute with a graph, we need a concrete representation — an adjacency list, an adjacency matrix, or an incidence matrix. And to tell whether two graphs that look different are secretly the &#x27;same&#x27; graph with relabeled vertices, we need the precise notion of graph isomorphism.",

    {
      "id": "c2",
      "title": "Adjacency matrices",

        {
          "type": "p",
          "text": "An adjacency list is convenient to read, but a matrix representation is often more convenient for computation — for example, when a graph is stored and processed by software."
        },
        {
          "type": "def",
          "text": "<b>Definition 1.</b> Suppose <span class=\"sym\">G = (V, E)</span> is a simple graph with <span class=\"sym\">|V| = n</span>. List the vertices of <span class=\"sym\">G</span> in some arbitrary order as <span class=\"sym\">v1, v2, …, vn</span>. The <b>adjacency matrix</b> <span class=\"sym\">A</span> (or <span class=\"sym\">A_G</span>) of <span class=\"sym\">G</span>, with respect to this listing, is the <span class=\"sym\">n × n</span> zero–one matrix with 1 as its <span class=\"sym\">(i, j)</span> entry when <span class=\"sym\">vi</span> and <span class=\"sym\">vj</span> are adjacent, and 0 as its <span class=\"sym\">(i, j)</span> entry when they are not."

          "type": "p",
          "text": "For the graph shown above, listing the vertices in the order <span class=\"sym\">v1, v2, v3, v4, v5</span> gives the matrix below. Because the graph is simple and undirected, every diagonal entry is 0 (no loops), and the matrix is symmetric about the diagonal — <span class=\"sym\">vi</span> is adjacent to <span class=\"sym\">vj</span> exactly when <span class=\"sym\">vj</span> is adjacent to <span class=\"sym\">vi</span>."
        },
        {
          "type": "table",
          "headers": ["", "<span class=\"sym\">v1</span>", "<span class=\"sym\">v2</span>", "<span class=\"sym\">v3</span>", "<span class=\"sym\">v4</span>", "<span class=\"sym\">v5</span>"],
          "rows": [

            ["<span class=\"sym\">v3</span>", "1", "1", "0", "0", "1"],
            ["<span class=\"sym\">v4</span>", "0", "1", "0", "0", "1"],

          "body": "Row v2 and column v2 agree: <span class=\"sym\">v2</span> is adjacent to <span class=\"sym\">v1, v3, v4</span>, so both the v2-row and the v2-column carry a 1 in exactly those three positions."
        }
      ]
    },
    {
      "id": "c3",
      "title": "Incidence matrices",
      "body": [
        {
          "type": "p",
          "text": "A third representation records how vertices meet edges, rather than how vertices relate to one another."

          "type": "def",
          "text": "<b>Definition 2.</b> Let <span class=\"sym\">G = (V, E)</span> be an undirected graph with vertices <span class=\"sym\">v1, v2, …, vn</span> and edges <span class=\"sym\">e1, e2, …, em</span>. The <b>incidence matrix</b> with respect to this ordering of <span class=\"sym\">V</span> and <span class=\"sym\">E</span> is the <span class=\"sym\">n × m</span> matrix <span class=\"sym\">M = [mij]</span>, where <span class=\"sym\">mij = 1</span> if edge <span class=\"sym\">ej</span> is incident with vertex <span class=\"sym\">vi</span>, and <span class=\"sym\">mij = 0</span> otherwise."

      "id": "c4",
      "title": "Graph isomorphism",

        {
          "type": "def",
          "text": "<b>Definition 3.</b> The simple graphs <span class=\"sym\">G1 = (V1, E1)</span> and <span class=\"sym\">G2 = (V2, E2)</span> are <b>isomorphic</b> if there is a one-to-one and onto function <span class=\"sym\">f</span> from <span class=\"sym\">V1</span> to <span class=\"sym\">V2</span> such that, for all <span class=\"sym\">a, b ∈ V1</span>, <span class=\"sym\">a</span> and <span class=\"sym\">b</span> are adjacent in <span class=\"sym\">G1</span> if and only if <span class=\"sym\">f(a)</span> and <span class=\"sym\">f(b)</span> are adjacent in <span class=\"sym\">G2</span>. Such an <span class=\"sym\">f</span> is called an <b>isomorphism</b>. Two simple graphs that are not isomorphic are called <b>non-isomorphic</b>."
        },
        {
          "type": "p",
          "text": "In other words, <span class=\"sym\">G1</span> and <span class=\"sym\">G2</span> are isomorphic exactly when there is a one-to-one correspondence between their vertices that preserves the adjacency relationship — relabel the vertices of one graph and it becomes identical to the other."
        },
        {
          "type": "p",
          "text": "Consider the graph <span class=\"sym\">G</span> below, with vertices <span class=\"sym\">u1, u2, u3, u4</span> and edges <span class=\"sym\">u1-u2, u1-u3, u2-u4, u3-u4</span>."

        {
          "type": "p",
          "text": "Definition 3 says two graphs are isomorphic when some one-to-one, onto, adjacency-preserving function between their vertex sets exists — but the definition does not tell us how to search for that function, or when to give up. Often it is much easier to show that two graphs are NOT isomorphic."

          "type": "def",
          "text": "A property that every isomorphism must preserve — so that isomorphic graphs necessarily agree on it — is called a <b>graph invariant</b>. If two graphs disagree on any invariant, they cannot be isomorphic."

          "type": "ul",
          "items": [
            "Isomorphic simple graphs have the same number of vertices, because an isomorphism sets up a one-to-one correspondence between the two vertex sets.",

        }
      ]
    }
