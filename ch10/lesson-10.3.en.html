  "id": "10.3",
  "chapter": "10",
  "title": "Special Types of Graphs",
  "lede": "Certain graph families show up so often — complete graphs, cycles, wheels, hypercubes, and bipartite graphs — that they have earned their own names and notation. Learning to recognize them on sight is a core graph-theory skill.",
  "concepts": [
    {
      "id": "c1",

      "body": [
        {
          "type": "p",
          "text": "A complete graph on <span class=\"sym\">n</span> vertices, denoted <span class=\"sym\">K_n</span>, is a simple graph that contains exactly one edge between each pair of distinct vertices."

        },
        {
          "type": "p",
          "text": "The first few complete graphs — <span class=\"sym\">K_1, K_2, K_3, K_4, K_5</span> — have 1, 2, 3, 4, and 5 vertices respectively, each drawn with every possible edge present. The diagram above is <span class=\"sym\">K_4</span>."
        },
        {
          "type": "note",
          "kind": "tip",
          "text": "Because each of the <span class=\"sym\">n</span> vertices is joined to every one of the other <span class=\"sym\">n − 1</span> vertices by a single edge, a complete graph <span class=\"sym\">K_n</span> has <span class=\"sym\">n(n − 1)/2</span> edges. For <span class=\"sym\">K_4</span> above, that's <span class=\"sym\">4·3/2 = 6</span> edges — count them in the diagram."
        }
      ]
    },
    {
      "id": "c2",
      "title": "Cycles and wheels",
      "body": [
        {
          "type": "def",
          "text": "<b>Definition.</b> A cycle <span class=\"sym\">C_n</span>, for <span class=\"sym\">n ≥ 3</span>, consists of <span class=\"sym\">n</span> vertices <span class=\"sym\">v_1, v_2, …, v_n</span> and the edges <span class=\"sym\">{v_1, v_2}, {v_2, v_3}, …, {v_{n-1}, v_n}</span>, and <span class=\"sym\">{v_n, v_1}</span>."
        },

          "type": "mermaid",
          "code": "graph LR\n  v1((v1)) --- v2((v2))\n  v2 --- v3((v3))\n  v3 --- v4((v4))\n  v4 --- v5((v5))\n  v5 --- v1"
        },
        {
          "type": "p",
          "text": "The diagram above is the cycle <span class=\"sym\">C_5</span>: five vertices arranged in a ring, each joined to its two neighbors."
        },
        {
          "type": "p",
          "text": "We obtain a wheel <span class=\"sym\">W_n</span> when we add an additional vertex to a cycle <span class=\"sym\">C_n</span> (<span class=\"sym\">n ≥ 3</span>) and connect this new vertex — the <b>hub</b> — to each of the <span class=\"sym\">n</span> vertices in <span class=\"sym\">C_n</span> by new edges, called spokes."
        },
        {
          "type": "mermaid",
          "code": "graph LR\n  v1((v1)) --- v2((v2))\n  v2 --- v3((v3))\n  v3 --- v4((v4))\n  v4 --- v5((v5))\n  v5 --- v1\n  hub((hub)) --- v1\n  hub --- v2\n  hub --- v3\n  hub --- v4\n  hub --- v5"

          "type": "p",
          "text": "The diagram above is the wheel <span class=\"sym\">W_5</span>, built from the <span class=\"sym\">C_5</span> above by adding the hub and its five spokes."
        }
      ]
    },

          "type": "def",
          "text": "<b>Definition.</b> An <span class=\"sym\">n</span>-dimensional hypercube, or <span class=\"sym\">n</span>-cube, denoted <span class=\"sym\">Q_n</span>, is a graph that has vertices representing the <span class=\"sym\">2^n</span> bit strings of length <span class=\"sym\">n</span>. Two vertices are adjacent if and only if the bit strings they represent differ in exactly one bit position."
        },
        {
          "type": "mermaid",
          "code": "graph LR\n  b000((000)) --- b001((001))\n  b000 --- b010((010))\n  b000 --- b100((100))\n  b001 --- b011((011))\n  b001 --- b101((101))\n  b010 --- b011\n  b010 --- b110((110))\n  b011 --- b111((111))\n  b100 --- b101\n  b100 --- b110\n  b101 --- b111\n  b110 --- b111"
        },
        {
          "type": "p",
          "text": "The diagram above is <span class=\"sym\">Q_3</span>: its 8 vertices are the length-3 bit strings <span class=\"sym\">000</span> through <span class=\"sym\">111</span>, and an edge joins two of them exactly when they differ in one position — for example <span class=\"sym\">010</span> and <span class=\"sym\">011</span> are adjacent, but <span class=\"sym\">010</span> and <span class=\"sym\">101</span> are not (they differ in all three positions)."
        },
        {
          "type": "note",
          "kind": "tip",
          "text": "Each of the <span class=\"sym\">2^n</span> vertices of <span class=\"sym\">Q_n</span> is adjacent to exactly <span class=\"sym\">n</span> others — one neighbor for each bit position that can be flipped — so <span class=\"sym\">Q_n</span> has <span class=\"sym\">n · 2^{n-1}</span> edges. For <span class=\"sym\">Q_3</span> above that's <span class=\"sym\">3 · 4 = 12</span> edges, matching the 12 edges drawn."
        }
      ]
    },
    {
      "id": "c4",
      "title": "Bipartite graphs",
      "body": [
        {
          "type": "def",
          "text": "<b>Definition 6.</b> A simple graph <span class=\"sym\">G</span> is called <b>bipartite</b> if its vertex set <span class=\"sym\">V</span> can be partitioned into two disjoint sets <span class=\"sym\">V_1</span> and <span class=\"sym\">V_2</span> such that every edge in the graph connects a vertex in <span class=\"sym\">V_1</span> and a vertex in <span class=\"sym\">V_2</span> (no edge connects two vertices within <span class=\"sym\">V_1</span>, or two within <span class=\"sym\">V_2</span>). The pair <span class=\"sym\">(V_1, V_2)</span> is called a <b>bipartition</b> of <span class=\"sym\">V</span>."
        },
        {
          "type": "example",
          "title": "A bipartite graph",
          "blocks": [
            {
              "type": "p",
              "text": "Take the bipartition <span class=\"sym\">V_1 = {v_1, v_3, v_5}</span> and <span class=\"sym\">V_2 = {v_2, v_4, v_6}</span>. The diagram below shows one bipartite graph consistent with that bipartition — every edge runs between the two sets, never within one."
            },
            {
              "type": "mermaid",
              "code": "graph LR\n  v1((v1)) --- v2((v2))\n  v1 --- v4((v4))\n  v3((v3)) --- v2\n  v3 --- v6((v6))\n  v5((v5)) --- v4\n  v5 --- v6"
            },
            {
              "type": "note",
              "kind": "tip",
              "text": "This is simply <b>a</b> bipartite graph with bipartition <span class=\"sym\">{v_1, v_3, v_5}</span> / <span class=\"sym\">{v_2, v_4, v_6}</span> — the exact edge set of the original textbook figure is not reproduced here, only an illustration consistent with the stated bipartition."
            }
          ]
        },
        {
          "type": "example",
          "title": "Recognizing bipartite vs. non-bipartite",
          "blocks": [
            {
              "type": "p",
              "text": "Consider two graphs <span class=\"sym\">G</span> and <span class=\"sym\">H</span>. Graph <span class=\"sym\">G</span> is bipartite: its vertices split into <span class=\"sym\">{a, b, d}</span> and <span class=\"sym\">{c, e, f, g}</span>, and every edge of <span class=\"sym\">G</span> connects a vertex from the first set to a vertex from the second — no edge ever joins two vertices from the same set."
            },
            {
              "type": "p",
              "text": "Graph <span class=\"sym\">H</span>, however, is <b>not</b> bipartite: no way of splitting its vertices into two sets avoids putting some edge between two vertices of the same set — for instance, because <span class=\"sym\">H</span> contains a cycle of odd length, which can never be 2-colored properly."
            }
          ]
        },
        {
          "type": "def",
          "text": "<b>Theorem 4.</b> A simple graph is bipartite if and only if it is possible to assign one of two different colors to each vertex of the graph so that no two adjacent vertices are assigned the same color."
        },
        {
          "type": "note",
          "kind": "tip",
          "text": "This 2-coloring test is one of the most practical ways to check bipartiteness by hand: pick any vertex, color it, then walk the graph coloring every neighbor the opposite color. If you ever get stuck forcing two adjacent vertices to share a color, the graph is not bipartite."
        }

          "text": "<b>Definition.</b> A complete bipartite graph <span class=\"sym\">K_{m,n}</span> is a graph whose vertex set is partitioned into two subsets of <span class=\"sym\">m</span> and <span class=\"sym\">n</span> vertices, respectively, with an edge between two vertices if and only if one vertex is in the first subset and the other is in the second subset."
        },

          "text": "Commonly pictured complete bipartite graphs include <span class=\"sym\">K_{2,3}</span>, <span class=\"sym\">K_{3,3}</span>, <span class=\"sym\">K_{3,5}</span>, and <span class=\"sym\">K_{2,6}</span> — the subscripts giving the size of each side."

          "type": "mermaid",

          "type": "note",
          "kind": "tip",
          "text": "A complete bipartite graph <span class=\"sym\">K_{m,n}</span> has <span class=\"sym\">m · n</span> edges — one for every pairing of a vertex from the <span class=\"sym\">m</span>-side with a vertex from the <span class=\"sym\">n</span>-side. So <span class=\"sym\">K_{2,3}</span> above has <span class=\"sym\">2 · 3 = 6</span> edges — count them in the diagram."
        }
      ]
    }
