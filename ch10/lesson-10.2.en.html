  "title": "Graph Terminology: Degree and Neighborhoods",
  "lede": "Once we have a graph, we need a precise vocabulary for its local structure — which vertices touch which edges, which vertices sit next to each other, and how many edges meet at a vertex. That vocabulary culminates in the <b>Handshaking Theorem</b>, a simple identity that ties the local view (the degree of each vertex) to the global view (the total number of edges).",
  "concepts": [
    {
      "id": "c1",
      "title": "Adjacency and neighborhoods",
      "body": [
        {
          "type": "def",
          "text": "<b>Definition 1.</b> Two vertices <span class=\"sym\">u</span> and <span class=\"sym\">v</span> in an undirected graph <span class=\"sym\">G</span> are called <b>adjacent</b> (or <b>neighbors</b>) in <span class=\"sym\">G</span> if <span class=\"sym\">u</span> and <span class=\"sym\">v</span> are endpoints of an edge <span class=\"sym\">e</span> of <span class=\"sym\">G</span>. Such an edge <span class=\"sym\">e</span> is called <b>incident with</b> the vertices <span class=\"sym\">u</span> and <span class=\"sym\">v</span>, and <span class=\"sym\">e</span> is said to <b>connect</b> <span class=\"sym\">u</span> and <span class=\"sym\">v</span>."
        },
        {
          "type": "def",
          "text": "<b>Definition 2.</b> The set of all neighbors of a vertex <span class=\"sym\">v</span> of <span class=\"sym\">G = (V, E)</span>, denoted <span class=\"sym\">N(v)</span>, is called the <b>neighborhood</b> of <span class=\"sym\">v</span>. If <span class=\"sym\">A</span> is a subset of <span class=\"sym\">V</span>, we let <span class=\"sym\">N(A)</span> denote the set of all vertices in <span class=\"sym\">G</span> that are adjacent to at least one vertex in <span class=\"sym\">A</span>. So <span class=\"sym\">N(A) = ∪<sub>v∈A</sub> N(v)</span>."
        },
        {
          "type": "p",
          "text": "Adjacency and neighborhoods only depend on which edges exist, not on any labeling or drawing of the graph — they are purely structural notions."
        }
      ],
      "examples": [
        {
          "label": "Neighbors from an edge list",
          "body": "If <span class=\"sym\">e = {u, v}</span> is an edge of <span class=\"sym\">G</span>, then <span class=\"sym\">u ∈ N(v)</span> and <span class=\"sym\">v ∈ N(u)</span>: adjacency is symmetric because an (undirected) edge has no preferred direction between its two endpoints."
        }
      ]
    },
    {
      "id": "c2",
      "title": "Degree, isolated and pendant vertices",
      "body": [
        {
          "type": "def",
          "text": "<b>Definition 3.</b> The <b>degree</b> of a vertex in an undirected graph is the number of edges incident with it, <b>except</b> that a loop at a vertex contributes <b>twice</b> to the degree of that vertex. The degree of the vertex <span class=\"sym\">v</span> is denoted <span class=\"sym\">deg(v)</span>."
        },
        {
          "type": "ul",
          "items": [
            "A vertex of degree zero is called <b>isolated</b>. Since it has degree zero, an isolated vertex is not adjacent to any vertex.",
            "A vertex is called <b>pendant</b> if and only if it has degree one. A pendant vertex is adjacent to exactly one other vertex."
          ]
        },
        {
          "type": "example",
          "title": "Worked example — degrees and neighborhoods of graph G",
          "blocks": [
            {
              "type": "p",
              "text": "Let <span class=\"sym\">G</span> be the undirected graph on vertices <span class=\"sym\">{a, b, c, d, e, f, g}</span> with edge set <span class=\"sym\">{a–b, a–f, b–c, b–e, b–f, c–d, c–e, c–f, e–f}</span> (and <span class=\"sym\">g</span> isolated):"
            },
            {
              "type": "mermaid",
              "code": "graph LR\n  a((a)) --- b((b))\n  a --- f((f))\n  b --- c((c))\n  b --- e((e))\n  b --- f\n  c --- d((d))\n  c --- e\n  c --- f\n  e --- f\n  g((g))"

              "headers": ["Vertex", "deg(v)", "N(v)"],

                ["<span class=\"sym\">c</span>", "<span class=\"sym\">4</span>", "<span class=\"sym\">{b, d, e, f}</span>"],
                ["<span class=\"sym\">d</span>", "<span class=\"sym\">1</span>", "<span class=\"sym\">{c}</span>"],
                ["<span class=\"sym\">e</span>", "<span class=\"sym\">3</span>", "<span class=\"sym\">{b, c, f}</span>"],
                ["<span class=\"sym\">f</span>", "<span class=\"sym\">4</span>", "<span class=\"sym\">{a, b, c, e}</span>"],
                ["<span class=\"sym\">g</span>", "<span class=\"sym\">0</span>", "<span class=\"sym\">∅</span>"]
              ]
            },
            {
              "type": "note",
              "kind": "tip",
              "text": "Vertex <span class=\"sym\">g</span> is <b>isolated</b> (<span class=\"sym\">deg(g) = 0</span>, it touches no edge), and vertex <span class=\"sym\">d</span> is <b>pendant</b> (<span class=\"sym\">deg(d) = 1</span>, adjacent only to <span class=\"sym\">c</span>)."
            }
          ]
        },
        {
          "type": "note",
          "kind": "warn",
          "text": "A <b>loop</b> counts <b>twice</b> toward the degree of the vertex it touches. For instance, a pseudograph <span class=\"sym\">H</span> on vertices <span class=\"sym\">{a, b, c, d, e}</span> with a loop at one of its vertices could have <span class=\"sym\">deg(a) = 4</span>, <span class=\"sym\">deg(b) = 6</span>, <span class=\"sym\">deg(c) = 1</span>, <span class=\"sym\">deg(d) = 5</span>, <span class=\"sym\">deg(e) = 6</span> — the loop is what lets a vertex such as <span class=\"sym\">b</span> or <span class=\"sym\">e</span> reach a degree higher than its number of distinct neighbors would otherwise allow."
        }
      ]
    },
    {
      "id": "c3",
      "title": "The Handshaking Theorem",
      "body": [
        {
          "type": "def",
          "text": "<b>Theorem 1 (The Handshaking Theorem).</b> Let <span class=\"sym\">G = (V, E)</span> be an undirected graph with <span class=\"sym\">m</span> edges. Then <span class=\"sym\">2m = Σ<sub>v∈V</sub> deg(v)</span>."

            }

          "type": "def",
          "text": "<b>Definition 4.</b> When <span class=\"sym\">(u, v)</span> is an edge of a graph <span class=\"sym\">G</span> with directed edges, <span class=\"sym\">u</span> is said to be <b>adjacent to</b> <span class=\"sym\">v</span>, and <span class=\"sym\">v</span> is said to be <b>adjacent from</b> <span class=\"sym\">u</span>. The vertex <span class=\"sym\">u</span> is called the <b>initial vertex</b> of <span class=\"sym\">(u, v)</span>, and <span class=\"sym\">v</span> is called the <b>terminal</b> (or <b>end</b>) vertex of <span class=\"sym\">(u, v)</span>. The initial and terminal vertex of a loop are the same."
        },
        {
          "type": "def",
          "text": "<b>Definition 5.</b> In a graph with directed edges, the <b>in-degree</b> of a vertex <span class=\"sym\">v</span>, denoted <span class=\"sym\">deg⁻(v)</span>, is the number of edges with <span class=\"sym\">v</span> as their terminal vertex. The <b>out-degree</b> of <span class=\"sym\">v</span>, denoted <span class=\"sym\">deg⁺(v)</span>, is the number of edges with <span class=\"sym\">v</span> as their initial vertex. (A loop at a vertex adds one to both its in-degree and its out-degree.)"
        },
        {
          "type": "def",
          "text": "<b>Theorem 3.</b> Let <span class=\"sym\">G = (V, E)</span> be a graph with directed edges. Then <span class=\"sym\">Σ<sub>v∈V</sub> deg⁻(v) = Σ<sub>v∈V</sub> deg⁺(v) = |E|</span>."

                ["<span class=\"sym\">c</span>", "<span class=\"sym\">3</span>", "<span class=\"sym\">2</span>"],
                ["<span class=\"sym\">d</span>", "<span class=\"sym\">2</span>", "<span class=\"sym\">2</span>"],
                ["<span class=\"sym\">e</span>", "<span class=\"sym\">3</span>", "<span class=\"sym\">3</span>"],
                ["<span class=\"sym\">f</span>", "<span class=\"sym\">0</span>", "<span class=\"sym\">0</span>"]
              ]
            },
            {
              "type": "p",
              "text": "Both the in-degree column and the out-degree column sum to <span class=\"sym\">2+2+3+2+3+0 = 12</span> and <span class=\"sym\">4+1+2+2+3+0 = 12</span> respectively, matching <span class=\"sym\">|E| = 12</span> exactly as Theorem 3 requires."
            }
          ]
        }
      ]
    }
  ],
