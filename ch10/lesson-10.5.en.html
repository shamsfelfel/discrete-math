          "text": "Informally, a path is a sequence of edges that begins at a vertex of a graph and travels from vertex to vertex along edges of that graph."

          "type": "def",
          "text": "<b>Definition 1.</b> Let <span class=\"sym\">n</span> be a non-negative integer and <span class=\"sym\">G</span> an undirected graph. A <b>path</b> of length <span class=\"sym\">n</span> from <span class=\"sym\">u</span> to <span class=\"sym\">v</span> in <span class=\"sym\">G</span> is a sequence of <span class=\"sym\">n</span> edges <span class=\"sym\">e1, e2, …, en</span> of <span class=\"sym\">G</span> for which there exists a sequence of vertices <span class=\"sym\">x0 = u, x1, …, x(n−1), xn = v</span> such that <span class=\"sym\">ei</span> has, for <span class=\"sym\">i = 1, …, n</span>, the endpoints <span class=\"sym\">x(i−1)</span> and <span class=\"sym\">xi</span>. When the graph is simple, we denote this path by its vertex sequence <span class=\"sym\">x0, x1, …, xn</span>, because listing these vertices uniquely determines the path."
