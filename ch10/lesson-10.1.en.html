  "title": "Graphs and Graph Models",
  "lede": "A graph models a pairwise relationship between objects: a set of vertices connected by edges. Graphs are used to model computer networks, social networks, transportation systems, scheduling conflicts, and countless other structures where the question is simply which pairs of objects are related.",
  "concepts": [
    {
      "id": "c1",
      "title": "Graphs and their models",
      "body": [
        {
          "type": "def",
          "text": "<b>Definition 1.</b> A graph <span class=\"sym\">G = (V, E)</span> consists of <span class=\"sym\">V</span>, a nonempty set of vertices (also called nodes), and <span class=\"sym\">E</span>, a set of edges. Each edge has either one or two vertices associated with it, called its <b>endpoints</b>. An edge is said to <b>connect</b> its endpoints."
        },
        {
          "type": "p",
          "text": "A graph is called a <b>simple graph</b> when it satisfies two conditions:"
        },
        {
          "type": "ul",
          "items": [
            "Each edge connects two <i>different</i> vertices (no edge connects a vertex to itself).",
            "No two edges connect the same pair of vertices (at most one edge between any two vertices)."
          ]
        },
        {
          "type": "p",
          "text": "Simple graphs are the most restrictive — and most common — starting point for graph models; the sections below relax each of these two conditions in turn."
        },
        {
          "type": "mermaid",
          "code": "graph LR\n  A((A)) --- B((B))\n  B --- C((C))\n  C --- D((D))\n  D --- A\n  A --- C"
        }
      ],
      "examples": [
        {
          "label": "A simple graph on A, B, C, D",
          "body": "The vertices <span class=\"sym\">A, B, C, D</span> are joined by the edges <span class=\"sym\">{A,B}, {B,C}, {C,D}, {D,A}, {A,C}</span> — no vertex is joined to itself, and no pair of vertices is joined twice, so this is a simple graph. (This is only an illustrative example graph on four vertices, not a reproduction of any particular textbook figure.)"
        }
      ]
    },
    {
      "id": "c2",
      "title": "Multigraphs and pseudographs",
      "body": [
        {
          "type": "p",
          "text": "Graph models sometimes need more than a simple graph can offer. A computer network, for instance, may have several parallel links between the same two data centers — for extra bandwidth or redundancy — so the model needs to allow more than one edge between the same pair of vertices. A communications link might even connect a data center to itself, such as a feedback loop used for self-diagnostics — so the model needs to allow an edge whose two endpoints are the same vertex."
        },
        {
          "type": "def",
          "text": "<b>Multigraph.</b> A <b>multigraph</b> is a graph that may have multiple edges connecting the same pair of vertices (but no loops)."
        },
        {
          "type": "def",
          "text": "<b>Pseudograph.</b> A <b>pseudograph</b> is a graph that may include <b>loops</b> — edges that connect a vertex to itself — and possibly also multiple edges connecting the same pair of vertices, or the same vertex to itself."
        },
        {
          "type": "note",
          "kind": "tip",
          "text": "Every simple graph is automatically a multigraph, and every multigraph is automatically a pseudograph — the three terms describe progressively looser rules on the same underlying idea of vertices and edges."
        }
      ],
      "examples": [
        {
          "label": "Redundant network links",
          "body": "If data centers <span class=\"sym\">A</span> and <span class=\"sym\">B</span> are joined by two independent cables for redundancy, the model needs <i>two</i> edges between <span class=\"sym\">A</span> and <span class=\"sym\">B</span> — this graph is a multigraph, not a simple graph."
        }
      ]
    },

      "title": "Directed graphs",
      "body": [

          "type": "p",
          "text": "All of the graphs described above are <b>undirected</b> — an edge <span class=\"sym\">{u, v}</span> simply connects <span class=\"sym\">u</span> and <span class=\"sym\">v</span>, with no sense of direction. To build a graph model of a relationship that does have a direction — a one-way street, a link that only sends data one way, a course prerequisite — we assign a direction to each edge."
        },
        {
          "type": "def",
          "text": "<b>Definition 2.</b> A <b>directed graph</b> (or <b>digraph</b>) <span class=\"sym\">(V, E)</span> consists of a nonempty set of vertices <span class=\"sym\">V</span> and a set of directed edges (or <b>arcs</b>) <span class=\"sym\">E</span>. Each directed edge is associated with an ordered pair of vertices. The directed edge associated with the ordered pair <span class=\"sym\">(u, v)</span> is said to <b>start</b> at <span class=\"sym\">u</span> and <b>end</b> at <span class=\"sym\">v</span>."
        },

          "type": "p",
