  "title": "Shortest-Path Problems and Dijkstra's Algorithm",
  "lede": "Many real problems reduce to finding the cheapest way through a weighted graph — the <b>shortest-path problem</b>. <span class=\"sym\">Dijkstra</span>'s greedy algorithm solves it efficiently for graphs whose edge weights are all positive.",
  "concepts": [
    {
      "id": "c1",
      "title": "Weighted graphs and the shortest-path problem",
      "body": [
        {
          "type": "p",
          "text": "Many problems can be modeled using graphs with weights assigned to their edges. A graph that has a number assigned to each of its edges is called a <b>weighted graph</b>. Determining a path of least total weight between two vertices in a network is one of the problems that arises frequently in applications — for instance, finding the cheapest route between two cities in a road network, or the fastest routing of a message through a computer network."
        },
        {
          "type": "def",
          "text": "<b>Definition.</b> In a weighted graph, the <b>length of a path</b> is the sum of the weights of the edges of that path. A <b>shortest path</b> between two given vertices is a path between them of least length (that is, of least total weight — not necessarily the fewest edges)."
        },
        {
          "type": "p",
          "text": "This is different from an unweighted graph, where the natural question is the fewest edges between two vertices. In a weighted graph, a path with more edges can still be shorter overall if its edges carry smaller weights."

          "type": "note",
          "kind": "tip",
          "text": "A weighted graph with all weights equal to <span class=\"sym\">1</span> reduces the shortest-path problem to the ordinary fewest-edges problem — so shortest-path is a genuine generalization of that simpler question."
        },
        {
          "type": "p",
          "text": "A related, much harder problem is the famous <b>traveling salesperson problem</b>: given a complete graph in which every pair of vertices is joined by a weighted edge, find a circuit of least total weight that visits every vertex exactly once and returns to the start. This asks for the order in which a salesperson should visit each city on a route so that the total distance traveled is as small as possible. Unlike the shortest-path problem, no efficient algorithm is known for it in general."
        }

        }

      "title": "Dijkstra's Algorithm",

        {
          "type": "p",
          "text": "There are several algorithms for finding a shortest path between two vertices in a weighted graph. Here we present the greedy algorithm discovered by the Dutch mathematician <span class=\"sym\">Edsger Dijkstra</span> in 1959. The version described here solves the shortest-path problem in undirected weighted graphs where all weights are positive."
        },
        {
          "type": "p",
          "text": "The algorithm is <b>greedy</b>: at every stage it commits to the closest unvisited vertex without ever revisiting that choice, and (because all weights are positive) that local choice turns out to always be globally correct."
        },

          "type": "ol",
          "items": [
            "<b>To start:</b> choose the starting vertex. Label the starting vertex's distance <span class=\"sym\">0</span> and every other vertex's distance <span class=\"sym\">∞</span> (it has not been reached yet).",
            "<b>Repeating step — examine neighbors:</b> look at the unvisited neighbors of the current (just-visited) vertex, and for each one compute its distance from the start through the current vertex (the current vertex's distance plus the connecting edge's weight).",
            "<b>Relax if shorter:</b> if that calculated distance is less than the neighbor's currently known distance, relabel the neighbor with the smaller distance and record the path that achieves it.",
            "<b>Move on:</b> among all unvisited vertices, visit the one with the smallest known distance from the start vertex.",
            "<b>Repeat:</b> repeat steps 2–4 until every vertex has been visited. Each vertex's final label is then its shortest distance from the start."
          ]
        },
        {
          "type": "note",
          "kind": "warn",
          "text": "This version of the algorithm requires every edge weight to be <b>positive</b>. With negative weights the greedy choice can be wrong, and the labels are no longer guaranteed to be correct shortest distances."

      "examples": []

          "type": "mermaid",

        },
        {
          "type": "ol",
          "items": [
            "<b>Start at <span class=\"sym\">a</span>:</b> <span class=\"sym\">dist(a) = 0</span>, and every other vertex is labeled <span class=\"sym\">∞</span>.",
            "<b>Visit <span class=\"sym\">a</span></b> (distance <span class=\"sym\">0</span>): relax its neighbors <span class=\"sym\">b</span> and <span class=\"sym\">c</span> → <span class=\"sym\">dist(b) = 4</span> (path <span class=\"sym\">a-b</span>), <span class=\"sym\">dist(c) = 2</span> (path <span class=\"sym\">a-c</span>).",
            "<b>Visit <span class=\"sym\">c</span></b> (smallest unvisited distance, <span class=\"sym\">2</span>): relax its neighbors — <span class=\"sym\">b</span>: <span class=\"sym\">2 + 1 = 3 &lt; 4</span>, so update <span class=\"sym\">dist(b) = 3</span> (path <span class=\"sym\">a-c-b</span>); <span class=\"sym\">d</span>: <span class=\"sym\">2 + 8 = 10</span> (tentative); <span class=\"sym\">e</span>: <span class=\"sym\">2 + 10 = 12</span> (tentative).",
            "<b>Visit <span class=\"sym\">b</span></b> (distance <span class=\"sym\">3</span>): relax its neighbors — <span class=\"sym\">d</span>: <span class=\"sym\">3 + 5 = 8 &lt; 10</span>, update <span class=\"sym\">dist(d) = 8</span> (path <span class=\"sym\">a-c-b-d</span>).",
            "<b>Visit <span class=\"sym\">d</span></b> (distance <span class=\"sym\">8</span>): relax its neighbors — <span class=\"sym\">e</span>: <span class=\"sym\">8 + 2 = 10 &lt; 12</span>, update <span class=\"sym\">dist(e) = 10</span> (path <span class=\"sym\">a-c-b-d-e</span>); <span class=\"sym\">z</span>: <span class=\"sym\">8 + 6 = 14</span> (tentative).",
